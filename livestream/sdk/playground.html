<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Arcade · Playground</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0f12; color: #f2f3f5; font-family: system-ui, sans-serif; overflow: hidden; }
      [hidden] { display: none !important; }
      canvas { display: block; cursor: none; }
      #error { position: fixed; inset: 0; display: grid; place-content: center; padding: 40px; }
      #error pre { white-space: pre-wrap; color: #ff8fab; max-width: 900px; }
    </style>
  </head>
  <body>
    <!-- Run any game module directly: playground.html?src=/sdk/games/my-game.js -->
    <canvas id="stage" hidden></canvas>
    <div id="error" hidden><h2>Couldn't load the game</h2><pre></pre></div>
    <script type="module">
      import { defineGame, mountGame } from './index.js';

      const src = new URLSearchParams(location.search).get('src') ?? '/sdk/template/my-game.js';
      try {
        const module = await import(`${src}?v=${Date.now()}`);
        const game = defineGame(module.default);
        document.title = `${game.title} · Playground`;
        mountGame(game, { canvas: document.querySelector('#stage'), onExit: () => location.reload() });
      } catch (error) {
        document.querySelector('#error').hidden = false;
        document.querySelector('#error pre').textContent = `${src}\n\n${error.stack ?? error}`;
      }
    </script>
  </body>
</html>
